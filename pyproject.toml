[project]
name = "hum-to-song-ai-generator"
version = "0.9.2"
description = "Turn humming into full tracks. Plugin-host architecture with Python, C++, C#, and Java extensions."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "hum2song contributors" }]
dependencies = [
    "numpy>=1.26",
    "soundfile>=0.12",
    "librosa>=0.10",
    "torch>=2.3",
    "pydantic>=2.7",
    "tomli>=2.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "black>=24.4", "mypy>=1.10"]

[project.scripts]
hum2song = "hum2song.host.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hum2song"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"